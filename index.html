<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПриставкоПрибавлятель</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: #f5f7fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .app-container { width: 100%; max-width: 600px; background: white; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.06); overflow: hidden; transition: all 0.2s; }
        .menu-view { padding: 32px 28px; display: flex; flex-direction: column; gap: 24px; }
        .menu-view h1 { font-size: 24px; font-weight: 700; color: #1e293b; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .menu-view h1 .logo-emoji { font-size: 28px; }
        .menu-view h1 .name { background: linear-gradient(135deg, #4f46e5, #9333ea); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .menu-view h1 .version { background: #eef2ff; color: #4f46e5; font-size: 14px; padding: 4px 10px; border-radius: 40px; font-weight: 500; }
        .subtitle { color: #64748b; font-size: 15px; margin-top: -8px; }
        .prefix-field { display: flex; flex-direction: column; gap: 8px; }
        .prefix-field label { font-size: 15px; font-weight: 500; color: #334155; }
        .prefix-field input { padding: 16px 18px; border: 1.5px solid #e2e8f0; border-radius: 18px; font-size: 16px; outline: none; transition: border 0.15s, box-shadow 0.15s; background: #f8fafc; }
        .prefix-field input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99,102,241,0.15); background: white; }
        .btn-primary { background: #4f46e5; color: white; border: none; padding: 16px 24px; border-radius: 40px; font-size: 17px; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; box-shadow: 0 6px 14px rgba(79,70,229,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:hover { background: #4338ca; }
        .btn-primary:active { transform: scale(0.98); }
        .hint { font-size: 14px; color: #64748b; text-align: center; border-top: 1px solid #e9eef4; padding-top: 20px; }
        .hint code { background: #eef2ff; padding: 4px 8px; border-radius: 20px; font-size: 13px; color: #4f46e5; }
        .chat-view { display: none; flex-direction: column; height: 620px; max-height: 82vh; }
        .chat-header { padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid #e9eef4; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .chat-header .brand { font-weight: 700; font-size: 16px; color: #1e293b; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .chat-header .badge { background: #e0e7ff; color: #3730a3; padding: 6px 14px; border-radius: 30px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .chat-header .badge::before { content: "🔹 "; font-size: 12px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: white; }
        .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.18s ease-out; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.bot { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 12px 18px; border-radius: 22px; font-size: 16px; line-height: 1.4; word-break: break-word; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .user .bubble { background: #4f46e5; color: white; border-bottom-right-radius: 6px; }
        .bot .bubble { background: #f1f5f9; color: #0f172a; border-bottom-left-radius: 6px; border: 1px solid #e2e8f0; }
        .bot .bubble strong { font-weight: 700; color: #4f46e5; }
        .message-actions { display: flex; gap: 6px; margin-top: 6px; padding: 0 4px; flex-wrap: wrap; }
        .message-actions button { background: transparent; border: 1px solid #e2e8f0; color: #64748b; font-size: 12px; padding: 4px 10px; border-radius: 20px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; }
        .message-actions button:hover { background: #eef2ff; border-color: #c7d2fe; color: #4f46e5; }
        .timestamp { font-size: 11px; color: #94a3b8; margin-top: 5px; padding: 0 6px; }
        .chat-input-area { padding: 14px 20px; background: #f8fafc; border-top: 1px solid #e9eef4; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .chat-input-area .input-wrapper { flex: 1; min-width: 160px; }
        .chat-input-area input { width: 100%; padding: 14px 18px; border: 1.5px solid #e2e8f0; border-radius: 40px; font-size: 16px; outline: none; background: white; transition: border 0.15s, box-shadow 0.15s; }
        .chat-input-area input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        .chat-input-area .send-btn { background: #4f46e5; color: white; border: none; width: 52px; height: 52px; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s, transform 0.1s; flex-shrink: 0; box-shadow: 0 6px 14px rgba(79,70,229,0.3); }
        .chat-input-area .send-btn:hover { background: #4338ca; }
        .chat-input-area .send-btn:active { transform: scale(0.94); }
        .chat-input-area .menu-btn { background: #eef2ff; color: #4f46e5; border: none; width: 52px; height: 52px; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s, transform 0.1s; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .chat-input-area .menu-btn:hover { background: #e0e7ff; }
        .chat-input-area .menu-btn:active { transform: scale(0.94); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .empty-chat-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8; font-size: 15px; gap: 12px; text-align: center; padding: 30px; }
        .empty-chat-placeholder span { font-size: 40px; opacity: 0.6; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: white; padding: 12px 24px; border-radius: 40px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); pointer-events: none; z-index: 1000; display: flex; align-items: center; gap: 8px; max-width: 90vw; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #dc2626; }
        .share-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 900; padding: 16px; animation: fadeIn 0.15s ease-out; }
        .share-overlay.active { display: flex; }
        .share-modal { background: white; border-radius: 28px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 20px; animation: modalPop 0.2s cubic-bezier(0.16,1,0.3,1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
        .share-modal h2 { margin: 0; font-size: 20px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .share-modal .preview { background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 18px; padding: 16px 18px; font-size: 15px; color: #334155; line-height: 1.5; word-break: break-word; }
        .share-modal .preview .result-word { font-weight: 700; color: #4f46e5; font-size: 18px; }
        .share-modal .site-link { display: block; margin-top: 10px; font-size: 13px; color: #4f46e5; text-decoration: none; word-break: break-all; }
        .share-modal .site-link:hover { text-decoration: underline; }
        .share-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .share-buttons button { padding: 14px 12px; border-radius: 16px; border: 1.5px solid #e2e8f0; background: white; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; color: #334155; font-family: inherit; }
        .share-buttons button:hover { background: #f8fafc; border-color: #c7d2fe; transform: translateY(-1px); }
        .share-buttons button:active { transform: translateY(0); }
        .share-buttons button.vk:hover { background: #e8f0fe; border-color: #3b82f6; color: #2563eb; }
        .share-buttons button.tg:hover { background: #e8f6fc; border-color: #38bdf8; color: #0284c7; }
        .share-buttons button.wa:hover { background: #e8f8ec; border-color: #4ade80; color: #16a34a; }
        .share-buttons button.copy-btn:hover { background: #eef2ff; border-color: #a5b4fc; color: #4f46e5; }
        .share-modal .close-share { background: #f1f5f9; border: none; color: #64748b; padding: 12px; border-radius: 16px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s; font-family: inherit; }
        .share-modal .close-share:hover { background: #e2e8f0; }
        @media (max-width: 480px) { .share-buttons { grid-template-columns: 1fr; } .menu-view { padding: 24px 20px; } .chat-header .badge { max-width: 110px; font-size: 12px; } }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="menuView" class="menu-view">
            <h1><span class="logo-emoji"></span><span class="name">ПриставкоПрибавлятель</span><span class="version">v1</span></h1>
            <div class="subtitle">Приставляем приставку к любому слову ✨</div>
            <div class="prefix-field">
                <label for="prefixInput">Ваша приставка</label>
                <input type="text" id="prefixInput" placeholder="Например: круто" autocomplete="off" />
            </div>
            <button id="startBtn" class="btn-primary">🚀 Начать чат</button>
            <div class="hint">Пример: приставка <code>круто</code> + слово <code>фон</code> → <code>крутофон</code></div>
        </div>
        <div id="chatView" class="chat-view">
            <div class="chat-header">
                <div class="brand">ПриставкоПрибавлятель</div>
                <div class="badge" id="prefixBadge">приставка: —</div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat-placeholder" id="emptyPlaceholder"><span>💬</span>Напишите слово — и я приставлю к нему приставку.</div>
            </div>
            <div class="chat-input-area">
                <div class="input-wrapper"><input type="text" id="wordInput" placeholder="Введите слово..." autocomplete="off" /></div>
                <button id="sendBtn" class="send-btn" title="Отправить">➤</button>
                <button id="menuBtnInput" class="menu-btn" title="Вернуться в меню">↩️</button>
            </div>
        </div>
    </div>
    <div class="share-overlay" id="shareOverlay">
        <div class="share-modal">
            <h2>🎁 Поделиться результатом</h2>
            <div class="preview" id="sharePreview"></div>
            <div class="share-buttons">
                <button class="vk" data-share="vk">🟦 ВКонтакте</button>
                <button class="tg" data-share="tg">✈️ Telegram</button>
                <button class="wa" data-share="wa">🟢 WhatsApp</button>
                <button class="copy-btn" id="copyShareBtn">📋 Копировать</button>
            </div>
            <button class="close-share" id="closeShareBtn">Закрыть</button>
        </div>
    </div>
    <div class="toast" id="toast">✅ Скопировано</div>

    <script>
        (function() {
            // >>> ЗАШИТЫЙ URL САЙТА <<<
            const SITE_URL = 'https://ycukensearch.github.io/pristavkopribavlatel/';

            const menuView = document.getElementById('menuView');
            const chatView = document.getElementById('chatView');
            const prefixInput = document.getElementById('prefixInput');
            const startBtn = document.getElementById('startBtn');
            const prefixBadge = document.getElementById('prefixBadge');
            const chatMessages = document.getElementById('chatMessages');
            const wordInput = document.getElementById('wordInput');
            const sendBtn = document.getElementById('sendBtn');
            const menuBtnInput = document.getElementById('menuBtnInput');
            const shareOverlay = document.getElementById('shareOverlay');
            const sharePreview = document.getElementById('sharePreview');
            const closeShareBtn = document.getElementById('closeShareBtn');
            const copyShareBtn = document.getElementById('copyShareBtn');
            const toast = document.getElementById('toast');

            let currentPrefix = '';

            function showToast(message, isError = false) {
                toast.textContent = message;
                toast.classList.toggle('error', isError);
                toast.classList.add('show');
                clearTimeout(showToast._timer);
                showToast._timer = setTimeout(() => toast.classList.remove('show'), 2400);
            }

            function showMenu() {
                menuView.style.display = 'flex';
                chatView.style.display = 'none';
                prefixInput.focus();
                wordInput.value = '';
                currentPrefix = '';
                clearChatMessages();
            }

            function clearChatMessages() {
                chatMessages.innerHTML = '';
                const placeholder = document.createElement('div');
                placeholder.className = 'empty-chat-placeholder';
                placeholder.id = 'emptyPlaceholder';
                placeholder.innerHTML = '<span>💬</span> Напишите слово — и я приставлю к нему приставку.';
                chatMessages.appendChild(placeholder);
            }

            function escapeHtml(unsafe) {
                return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            function addMessage(text, type, extra = null) {
                const placeholder = document.getElementById('emptyPlaceholder');
                if (placeholder) placeholder.remove();

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'bubble';

                if (type === 'bot') {
                    if (currentPrefix && text.startsWith(currentPrefix)) {
                        bubbleDiv.innerHTML = `<strong>${escapeHtml(currentPrefix)}</strong>${escapeHtml(text.slice(currentPrefix.length))}`;
                    } else {
                        bubbleDiv.textContent = text;
                    }
                } else {
                    bubbleDiv.textContent = text;
                }
                messageDiv.appendChild(bubbleDiv);

                if (type === 'bot' && extra) {
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'message-actions';

                    const shareBtn = document.createElement('button');
                    shareBtn.innerHTML = '🎁 Поделиться';
                    shareBtn.addEventListener('click', () => openShareModal(extra));
                    actionsDiv.appendChild(shareBtn);

                    const copyBtn = document.createElement('button');
                    copyBtn.innerHTML = '📋 Копировать';
                    copyBtn.addEventListener('click', () => {
                        copyToClipboard(extra.result + '\n' + SITE_URL, 'Слово со ссылкой скопировано');
                    });
                    actionsDiv.appendChild(copyBtn);

                    messageDiv.appendChild(actionsDiv);
                }

                const timeDiv = document.createElement('div');
                timeDiv.className = 'timestamp';
                timeDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                messageDiv.appendChild(timeDiv);

                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function handleSendWord() {
                const word = wordInput.value.trim();
                if (!word) { wordInput.focus(); return; }
                addMessage(word, 'user');
                const resultWord = currentPrefix + word;
                setTimeout(() => {
                    addMessage(resultWord, 'bot', { userWord: word, prefix: currentPrefix, result: resultWord });
                }, 150);
                wordInput.value = '';
                wordInput.focus();
            }

            // ---- КОПИРОВАНИЕ ----
            function copyToClipboard(text, successMessage = 'Скопировано') {
                if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
                    navigator.clipboard.writeText(text)
                        .then(() => showToast('✅ ' + successMessage))
                        .catch(err => {
                            console.warn('navigator.clipboard failed, fallback:', err);
                            fallbackCopy(text, successMessage);
                        });
                    return;
                }
                fallbackCopy(text, successMessage);
            }

            function fallbackCopy(text, successMessage) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);

                let ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (e) {
                    console.error('execCommand copy failed:', e);
                }
                document.body.removeChild(ta);

                if (ok) {
                    showToast('✅ ' + successMessage);
                } else {
                    showToast('❌ Не удалось скопировать автоматически', true);
                    window.prompt('Скопируйте текст вручную:', text);
                }
            }

            // ---- МОДАЛКА ШАРИНГА ----
            function openShareModal({ result }) {
                sharePreview.innerHTML = `
                    <div style="font-size:13px;color:#64748b;margin-bottom:6px;">Результат:</div>
                    <div class="result-word">${escapeHtml(result)}</div>
                    <a class="site-link" href="${SITE_URL}" target="_blank" rel="noopener">🔗 ${escapeHtml(SITE_URL)}</a>
                `;
                shareOverlay.dataset.result = result;
                shareOverlay.classList.add('active');
            }

            function closeShareModal() {
                shareOverlay.classList.remove('active');
                delete shareOverlay.dataset.result;
            }

            // ---- ПЕРЕХОД В СОЦСЕТИ (ВСЕГДА РАБОТАЕТ) ----
            function shareTo(network) {
                const result = shareOverlay.dataset.result || '';
                const encodedUrl = encodeURIComponent(SITE_URL);
                const encodedText = encodeURIComponent(result);
                let shareUrl = '';

                switch (network) {
                    case 'vk':
                        // ВК: url + title. В посте будет "КрутоФон" + ссылка.
                        shareUrl = `https://vk.com/share.php?url=${encodedUrl}&title=${encodedText}`;
                        break;
                    case 'tg':
                        // Telegram: url + text. Ссылка будет в сообщении.
                        shareUrl = `https://t.me/share/url?url=${encodedUrl}&text=${encodedText}`;
                        break;
                    case 'wa':
                        // WhatsApp: текст + ссылка.
                        shareUrl = `https://wa.me/?text=${encodeURIComponent(result + ' ' + SITE_URL)}`;
                        break;
                    default:
                        return;
                }

                const win = window.open(shareUrl, '_blank', 'noopener,noreferrer,width=600,height=500');
                if (!win) {
                    showToast('❌ Браузер заблокировал окно. Разрешите всплывающие окна.', true);
                }
            }

            // ---- ОБРАБОТЧИКИ ----
            startBtn.addEventListener('click', () => {
                const prefix = prefixInput.value.trim();
                if (!prefix) {
                    showToast('Введите приставку, например «круто»', true);
                    prefixInput.focus();
                    return;
                }
                currentPrefix = prefix;
                prefixBadge.textContent = `приставка: ${currentPrefix}`;
                menuView.style.display = 'none';
                chatView.style.display = 'flex';
                clearChatMessages();
                wordInput.focus();
                wordInput.value = '';
            });

            sendBtn.addEventListener('click', handleSendWord);
            wordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); handleSendWord(); }
            });
            menuBtnInput.addEventListener('click', showMenu);

            closeShareBtn.addEventListener('click', closeShareModal);
            shareOverlay.addEventListener('click', (e) => {
                if (e.target === shareOverlay) closeShareModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && shareOverlay.classList.contains('active')) closeShareModal();
            });

            document.querySelectorAll('[data-share]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    shareTo(btn.dataset.share);
                });
            });

            copyShareBtn.addEventListener('click', () => {
                const result = shareOverlay.dataset.result || '';
                copyToClipboard(result + '\n' + SITE_URL, 'Результат со ссылкой скопирован');
            });

            showMenu();

            prefixInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); startBtn.click(); }
            });
        })();
    </script>
</body>
  </html>
